name: Class Central - Fetch related courses

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

# Queue runs rather than cancel, so a run's checkpointed progress is never
# abandoned mid-way.
concurrency:
  group: class-central-related-courses
  cancel-in-progress: false

env:
  # Hashnode host lookup keys off LOCALE_FOR_GHOST, not LOCALE_FOR_UI, so
  # this must stay "english" even though no Ghost posts are fetched.
  LOCALE_FOR_UI: english
  LOCALE_FOR_GHOST: english
  DO_NOT_FETCH_FROM_GHOST: true
  ELEVENTY_ENV: prod
  HASHNODE_API_URL: ${{ secrets.HASHNODE_API_URL }}
  ENGLISH_HASHNODE_HOST: ${{ secrets.ENGLISH_HASHNODE_HOST }}
  CLASS_CENTRAL_API_KEY: ${{ secrets.CLASS_CENTRAL_API_KEY }}
  DO_OBJECT_STORAGE_KEY_ID: ${{ secrets.DO_OBJECT_STORAGE_KEY_ID }}
  DO_OBJECT_STORAGE_SECRET: ${{ secrets.DO_OBJECT_STORAGE_SECRET }}

jobs:
  fetch:
    name: Fetch related courses
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch related courses from Class Central
        run: node ./tools/fetch-class-central.js
