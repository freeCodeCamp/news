name: i18n - Build and Deploy

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        languages:
          [chinese, espanol, italian, japanese, korean, portuguese, ukrainian]
        site_tlds: [org]

    env:
      BUILD_LANG: ${{ matrix.languages }}

      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}

      CHINESE_GHOST_API_URL: ${{ secrets.CHINESE_GHOST_API_URL }}
      CHINESE_GHOST_API_VERSION: ${{ secrets.CHINESE_GHOST_API_VERSION }}
      CHINESE_GHOST_CONTENT_API_KEY: ${{ secrets.CHINESE_GHOST_CONTENT_API_KEY }}

      ESPANOL_GHOST_API_URL: ${{ secrets.ESPANOL_GHOST_API_URL }}
      ESPANOL_GHOST_API_VERSION: ${{ secrets.ESPANOL_GHOST_API_VERSION }}
      ESPANOL_GHOST_CONTENT_API_KEY: ${{ secrets.ESPANOL_GHOST_CONTENT_API_KEY }}

      ITALIAN_GHOST_API_URL: ${{ secrets.ITALIAN_GHOST_API_URL }}
      ITALIAN_GHOST_API_VERSION: ${{ secrets.ITALIAN_GHOST_API_VERSION }}
      ITALIAN_GHOST_CONTENT_API_KEY: ${{ secrets.ITALIAN_GHOST_CONTENT_API_KEY }}

      JAPANESE_GHOST_API_URL: ${{ secrets.JAPANESE_GHOST_API_URL }}
      JAPANESE_GHOST_API_VERSION: ${{ secrets.JAPANESE_GHOST_API_VERSION }}
      JAPANESE_GHOST_CONTENT_API_KEY: ${{ secrets.JAPANESE_GHOST_CONTENT_API_KEY }}

      KOREAN_GHOST_API_URL: ${{ secrets.KOREAN_GHOST_API_URL }}
      KOREAN_GHOST_API_VERSION: ${{ secrets.KOREAN_GHOST_API_VERSION }}
      KOREAN_GHOST_CONTENT_API_KEY: ${{ secrets.KOREAN_GHOST_CONTENT_API_KEY }}

      PORTUGUESE_GHOST_API_URL: ${{ secrets.PORTUGUESE_GHOST_API_URL }}
      PORTUGUESE_GHOST_API_VERSION: ${{ secrets.PORTUGUESE_GHOST_API_VERSION }}
      PORTUGUESE_GHOST_CONTENT_API_KEY: ${{ secrets.PORTUGUESE_GHOST_CONTENT_API_KEY }}

      UKRAINIAN_GHOST_API_URL: ${{ secrets.UKRAINIAN_GHOST_API_URL }}
      UKRAINIAN_GHOST_API_VERSION: ${{ secrets.UKRAINIAN_GHOST_API_VERSION }}
      UKRAINIAN_GHOST_CONTENT_API_KEY: ${{ secrets.UKRAINIAN_GHOST_CONTENT_API_KEY }}

      ADS_ENABLED: ${{ secrets.ADS_ENABLED }}
      GOOGLE_ADSENSE_DATA_AD_CLIENT: ${{ secrets.GOOGLE_ADSENSE_DATA_AD_CLIENT }}
      GOOGLE_ADSENSE_DATA_AD_SLOT: ${{ secrets.GOOGLE_ADSENSE_DATA_AD_SLOT }}

      POSTS_PER_PAGE: ${{ secrets.POSTS_PER_PAGE }}

      SITE_DOMAIN: freecodecamp.${{ matrix.site_tlds }}

      LOCALE_FOR_UI: ${{ matrix.languages }}
      LOCALE_FOR_GHOST: ${{ matrix.languages }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        id: build
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build.log || {
            node ./tools/ci/annotate-build-log.js build.log "Build site (${{ matrix.languages }}, attempt 1 of 2)" warning || true
            echo "::warning::Build failed after in-app retries exhausted. Waiting 2 minutes before final job-level retry..."
            sleep 120
            echo "::notice::Retrying build site step..."
            pnpm run build 2>&1 | tee build.log
          }
        env:
          NODE_ENV: production

      - name: Annotate build failure
        if: failure() && steps.build.outcome == 'failure'
        run: node ./tools/ci/annotate-build-log.js build.log "Build site (${{ matrix.languages }})"

      - name: Create a tagname
        id: tagname
        run: |
          echo "tagname=$(git rev-parse --short HEAD)-$(date +%Y%m%d)-$(date +%H%M)" >> "$GITHUB_ENV"

      - name: Build & Tag Images
        run: |
          docker build . \
          --tag registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/news-${{ matrix.languages }}:"$tagname" \
          --tag registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/news-${{ matrix.languages }}:latest \
          --build-arg BUILD_LANGUAGE=${{ matrix.languages }} \
          --file docker/Dockerfile

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/news-${{ matrix.languages }}:"$tagname"
          docker push registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/news-${{ matrix.languages }}:latest

      # - name: Clean up Self-hosted setup
      #   uses: colpal/actions-clean@36e6ca1abd35efe61cb60f912bd7837f67887c8a # tag=v1
      #   if: ${{ always() }} # To ensure this step runs even when earlier steps fail

  deploy:
    name: Deploy
    needs: build
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - name: Setup and connect to Tailscale network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: gha-news-i18n-ci-${{ github.run_id }}
          tags: tag:ci
          version: latest

      - name: Wait for Tailscale Network Readiness
        run: |
          max_wait=60
          elapsed=0
          until tailscale status --json | jq -e '.BackendState == "Running"' >/dev/null 2>&1; do
            if [ "$elapsed" -ge "$max_wait" ]; then
              echo "Tailscale network not ready after ${max_wait}s"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

      - name: Trigger Gantry via Webhook
        env:
          WEBHOOK_HOST: ${{ secrets.WEBHOOK_HOST }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -fsS --max-time 30 -X POST "https://$WEBHOOK_HOST/hooks/run-gantry" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d '{"GANTRY_SERVICES_FILTERS":"name=prd-news","GANTRY_SERVICES_EXCLUDED":"prd-news_svc-eng"}'

  notify:
    name: Notify
    needs: [build, deploy]
    if: ${{ always() }}
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    steps:
      - name: Find the result to report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          bad='failure|cancelled|timed_out|startup_failure'
          if [ "$BUILD" = success ] && [ "$DEPLOY" = success ]; then
            if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
              last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$((GITHUB_RUN_ATTEMPT - 1))" \
                --jq '.conclusion // ""' || true)
            else
              last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-i18n.yml/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion // ""' || true)
            fi
            if printf '%s\n' "$last" | grep -Eqx "$bad"; then
              echo 'status=ok' >>"$GITHUB_OUTPUT"
              echo "summary=recovered: build and deploy succeeded, the last run is $last" >>"$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          details=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" |
            jq -r --arg bad "^($bad)\$" '.jobs[] | select((.conclusion // "") | test($bad))
              | "\(.name): \([.steps[] | select((.conclusion // "") | test($bad)) | .name] | join(", "))"' || true)
          {
            echo 'status=fail'
            echo "summary=FAILED: build $BUILD, deploy $DEPLOY"
            echo 'details<<EOF'
            printf '%s\n' "$details"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Post to Google Chat
        if: steps.report.outputs.status != ''
        uses: freeCodeCamp/infra/.github/actions/notify-chat@027d913d6f38ea37cfdac93e31805a274dd35b3c
        with:
          webhook: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: ${{ steps.report.outputs.status }}
          source: news
          subject: ${{ github.workflow }}
          summary: ${{ steps.report.outputs.summary }}
          details: ${{ steps.report.outputs.details }}
