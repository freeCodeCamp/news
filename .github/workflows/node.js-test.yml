name: CI - Node.js Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Set environment variables
        run: cp sample.env .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source files
        run: pnpm run lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        node-version: [26.x]
        languages: [english]

    env:
      POSTS_PER_PAGE: ${{ secrets.POSTS_PER_PAGE }}

      HASHNODE_API_URL: api_url_from_hashnode_dashboard
      ENGLISH_HASHNODE_HOST: host_from_hashnode_dashboard

      SITE_DOMAIN: localhost:8080

      LOCALE_FOR_UI: ${{ matrix.languages }}
      LOCALE_FOR_GHOST: ${{ matrix.languages }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set fetch from Ghost environment variable
        run: echo "DO_NOT_FETCH_FROM_GHOST=true" >> "$GITHUB_ENV"

      - name: Build CI site
        run: pnpm run build:ci

      - name: Run tests
        run: pnpm run test

      - name: Perform Typescript Typecheck
        run: pnpm run type-check

      - name: Build serving image
        if: ${{ matrix.languages == 'english' }}
        run: |
          node ./config/i18n/generate-serve-config.js
          docker build --build-arg BUILD_LANGUAGE=english --file docker/Dockerfile --tag news-serving-test .

      - name: Smoke test serving image
        if: ${{ matrix.languages == 'english' }}
        run: |
          docker run --detach --name news-serving-test --publish 127.0.0.1:3000:3000 news-serving-test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/ --output /dev/null

      - name: Stop serving container
        if: ${{ always() && matrix.languages == 'english' }}
        run: docker rm --force news-serving-test
