name: CI - Cypress (e2e) tests
on:
  push:
    branches-ignore:
      - renovate/**
  pull_request:

jobs:
  cypress-run:
    name: E2E
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        browsers: [chrome, firefox]

    env:
      HASHNODE_API_URL: api_url_from_hashnode_dashboard
      ENGLISH_HASHNODE_HOST: host_from_hashnode_dashboard

      ADS_ENABLED: true
      GOOGLE_ADSENSE_DATA_AD_CLIENT: ca-pub-1234567890
      GOOGLE_ADSENSE_DATA_AD_SLOT: 1234567890

      POSTS_PER_PAGE: ${{ secrets.POSTS_PER_PAGE }}

      SITE_DOMAIN: localhost:8080

      LOCALE_FOR_UI: english
      LOCALE_FOR_GHOST: english

    steps:
      - name: Checkout source files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start CI server and run Cypress
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          start: pnpm run start:ci:english
          wait-on: http://localhost:8080
          wait-on-timeout: 1200
          browser: ${{ matrix.browsers }}
          headless: true
          spec: cypress/e2e/english/**/*
